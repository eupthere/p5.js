<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background: #f7f4ef;
        color: #201814;
        font-family: sans-serif;
      }

      main {
        display: grid;
        width: 100%;
        height: 100%;
        overflow: auto;
      }

      #runner-host {
        position: relative;
        width: 100%;
        height: 100%;
        min-width: 100%;
        min-height: 100%;
      }

      #runner-host iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
      }

      #error {
        position: absolute;
        inset: 0;
        overflow: auto;
        padding: 12px;
        background: #fff4f4;
        color: #9f1239;
        border-left: 4px solid #e11d48;
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="runner-host"></div>
      <div id="error"></div>
    </main>
    <script type="module" src="/src/runtime/frameRuntime.ts"></script>
  </body>
</html>
